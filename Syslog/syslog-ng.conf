@version: 4.13
@include "scl.conf"

# Recebe RFC3164 (formato default dos switches Huawei) em UDP e TCP 514.
# O parser default do syslog-ng extrai o PRI -> facility/severity, o timestamp
# e o hostname; o miolo proprietario Huawei (%%01MODULO/sev/MNEMONICO...) fica
# na linha do log, pesquisavel via LogQL no Grafana.
#
# keep-hostname(yes): usa o sysname que vem DENTRO da mensagem (ex.: SW04-POP-MAG-RJ)
# como $HOST. Sem isso, o syslog-ng (default keep-hostname(no)) sobrescreve o $HOST
# pelo IP do remetente -- que, via routing mesh do Swarm, ainda viria mascarado.
#
# validate-utf8: os switches Huawei mandam algumas linhas fora de UTF-8 (acentos em
# outro encoding, bytes de controle no payload). Sem essa flag, o destino loki()
# falha ao serializar o protobuf gRPC ("invalid UTF-8 data ... EntryAdapter.line")
# e a linha e descartada. Com a flag, o syslog-ng reencoda os octetos invalidos para
# o caractere de substituicao Unicode antes de repassar -- a linha chega ao Loki.
source s_switches {
    network(transport("udp") port(514) flags(store-raw-message, validate-utf8) keep-hostname(yes));
    network(transport("tcp") port(514) flags(store-raw-message, validate-utf8) keep-hostname(yes));
};

# Destino Loki nativo via gRPC interno na rede network_swarm_public.
# Nao precisa expor a porta 9095 externamente nem mexer no firewall do Loki.
# O nome curto "loki" resolve via alias do Swarm (o servico tambem responde
# como "loki_loki", convencao stack_servico, se precisar ser explicito).
destination d_loki {
    loki(
        url("loki:9095")
        labels(
            "job"       => "huawei-switches",
            "host"      => "${HOST}",
            "source_ip" => "${SOURCEIP}",
            "severity"  => "${LEVEL}",
            "facility"  => "${FACILITY}"
        )
        timestamp("received")     # usa a hora de recepcao (timestamps Huawei nao tem TZ/ano confiavel)
        batch-lines(1000)
        batch-timeout(1000)
        # disk-buffer p/ nao perder logs se o Loki ficar indisponivel:
        disk-buffer(disk-buf-size(536870912) reliable(yes) dir("/var/lib/syslog-ng"))
    );
};

log {
    source(s_switches);
    destination(d_loki);
};
