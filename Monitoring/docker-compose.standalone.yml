version: "3.8"

# Stack STANDALONE dos exporters — para o servidor 45.187.224.248.
#
# Diferente do docker-compose.yml (que roda no MESMO cluster Swarm do
# Prometheus e é resolvido por DNS interno da overlay), aqui o Docker é
# independente: o Prometheus em 45.187.224.251 coleta via IP PÚBLICO nas
# portas publicadas no host (9100 e 8080).
#
# Deploy (Docker Compose, NÃO Swarm):
#   docker compose -f docker-compose.standalone.yml up -d
#
# IMPORTANTE: proteja as portas 9100/8081 com o firewall-setup-248.sh,
# pois ao publicar portas o Docker ignora o UFW.
#
# OBS: o cAdvisor é publicado na porta 8081 do HOST (a 8080 já está em uso
# neste servidor). Dentro do container ele continua escutando na 8080.

services:
  # ── Métricas do HOST ──
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|securityfs|sysfs|tmpfs|tracefs)$$"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    restart: unless-stopped

  # ── Métricas por CONTAINER ──
  # Fora do Swarm, o Compose respeita privileged: melhora as métricas de
  # baixo nível do cAdvisor.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - "--housekeeping_interval=15s"
      - "--docker_only=true"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    restart: unless-stopped
