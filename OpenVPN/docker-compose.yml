version: '3.8'

services:
  openvpn:
    image: kylemanna/openvpn
    ports:
      # mode: host evita o routing mesh (ingress) do Swarm, que atrapalha UDP
      - target: 1194
        published: 1194
        protocol: udp
        mode: host
    volumes:
      - openvpn-data:/etc/openvpn
    configs:
      - source: openvpn_init
        target: /usr/local/bin/openvpn-init.sh
        mode: 0755
    secrets:
      - openvpn_password
    entrypoint: ["/usr/local/bin/openvpn-init.sh"]
    cap_add:
      - NET_ADMIN
    environment:
      - TZ=America/Sao_Paulo
      - OVPN_SERVER_HOST=45.187.224.251
      - OVPN_USER=gutobrrj
    deploy:
      replicas: 1
      restart_policy:
        condition: any

configs:
  openvpn_init:
    file: ./openvpn-init.sh

secrets:
  openvpn_password:
    external: true

volumes:
  openvpn-data:
