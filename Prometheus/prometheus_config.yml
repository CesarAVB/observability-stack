global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # App Spring Boot do CRM Lognet — coleta métricas via Actuator/Micrometer
  # sobre HTTPS no endpoint público da API.
  - job_name: 'lognet-crm'
    scheme: https
    metrics_path: '/api/v1/actuator/prometheus'
    tls_config:
      insecure_skip_verify: false
    static_configs:
      - targets: ['crm-api.redelognet.com.br']
        labels:
          app: 'lognet-crm'
          env: 'production'

  # node-exporter — métricas de hardware/SO do host Linux
  # (CPU, memória, disco, rede). Resolvido pela rede Docker na porta 9100.
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['monitoring_node-exporter:9100']
        labels:
          app: 'host-linux'
          env: 'production'

  # cAdvisor — métricas de uso de recursos por container Docker
  # (CPU, memória, I/O). Resolvido pela rede Docker na porta 8080.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['monitoring_cadvisor:8080']
        labels:
          app: 'containers'
          env: 'production'
