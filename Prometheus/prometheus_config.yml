global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus se auto-monitorando (scrape do próprio processo).
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Loki expõe métricas Prometheus nativamente na própria porta HTTP (3100).
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # blackbox_exporter — probe HTTP externo no endpoint público do CRM.
  # Usado para monitorar a saúde do Reverse Proxy/edge, que roda fora
  # desta infra (não temos acesso direto a ele nem exporter interno).
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://crm-api.redelognet.com.br/api/v1/actuator/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # App Spring Boot do CRM Lognet — coleta métricas via Actuator/Micrometer
  # sobre HTTPS no endpoint público da API.
  - job_name: 'lognet-crm'
    scheme: https
    metrics_path: '/api/v1/actuator/prometheus'
    tls_config:
      insecure_skip_verify: false
    static_configs:
      - targets: ['crm-api.redelognet.com.br']
        labels:
          app: 'lognet-crm'
          env: 'production'

  # node-exporter — métricas de hardware/SO do host Linux
  # (CPU, memória, disco, rede).
  #   - srv-251: mesmo cluster Swarm, scrape via DNS interno; o label
  #     `instance` é fixado no IP para aparecer assim no seletor do Grafana.
  #   - srv-248: Docker standalone, scrape via IP público.
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          app: 'host-linux'
          env: 'production'
          server: '224.251 - VPS LOGNET'
          instance: '45.187.224.251'
      - targets: ['45.187.224.248:9100']
        labels:
          app: 'host-linux'
          env: 'production'
          server: '224.248 - VPS ASB'
          instance: '45.187.224.248'

  # cAdvisor — métricas de uso de recursos por container Docker
  # (CPU, memória, I/O).
  #   - srv-251: mesmo cluster Swarm, scrape via DNS interno; `instance`
  #     fixado no IP para aparecer assim no seletor do Grafana.
  #   - srv-248: Docker standalone, scrape via IP público.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          app: 'containers'
          env: 'production'
          server: '224.251 - VPS LOGNET'
          instance: '45.187.224.251'
      - targets: ['45.187.224.248:8081']
        labels:
          app: 'containers'
          env: 'production'
          server: '224.248 - VPS ASB'
          instance: '45.187.224.248'
