global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Regras de alerta (montadas como Docker Config em /etc/prometheus/rules/).
rule_files:
  - /etc/prometheus/rules/alerts.yml

# Para onde mandar os alertas "firing". `alertmanager` resolve via alias do
# Swarm na rede network_swarm_public (stack Alertmanager/).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # O próprio Alertmanager expõe métricas Prometheus na porta 9093.
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Prometheus se auto-monitorando (scrape do próprio processo).
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Loki expõe métricas Prometheus nativamente na própria porta HTTP (3100).
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # blackbox_exporter — probe HTTP externo no endpoint público do CRM.
  # Usado para monitorar a saúde do Reverse Proxy/edge, que roda fora
  # desta infra (não temos acesso direto a ele nem exporter interno).
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://crm-api.redelognet.com.br/api/v1/actuator/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # App Spring Boot do CRM Lognet — coleta métricas via Actuator/Micrometer
  # sobre HTTPS no endpoint público da API.
  - job_name: 'lognet-crm'
    scheme: https
    metrics_path: '/api/v1/actuator/prometheus'
    tls_config:
      insecure_skip_verify: false
    static_configs:
      - targets: ['crm-api.redelognet.com.br']
        labels:
          app: 'lognet-crm'
          environment: 'production'

  # App Spring Boot do TalkChat ASB — coleta métricas via Actuator/Micrometer
  # sobre HTTPS no endpoint público da API. Diferente do CRM Lognet, o
  # "/api/v1" está só nos @RequestMapping dos controllers (não é context-path),
  # então o Actuator fica na raiz: metrics_path '/actuator/prometheus'.
  # job_name == spring.application.name == label application do Micrometer: o
  # seletor $app_name do dashboard usa label_values(..., application), não o job,
  # e o painel "App UP" usa up{job="..."} (o up só carrega labels do scrape).
  - job_name: 'talkchat-backend'
    scheme: https
    metrics_path: '/actuator/prometheus'
    tls_config:
      insecure_skip_verify: false
    static_configs:
      - targets: ['api-talkchat.asbtelecom.com.br']
        labels:
          app: 'talkchat-backend'
          environment: 'production'

  # App Spring Boot do VoIP Manager ASB (host api-pbx) — coleta métricas via
  # Actuator/Micrometer sobre HTTPS no endpoint público da API.
  # job_name == spring.application.name (voipmanager-backend) pelo mesmo motivo
  # do talkchat-backend acima. O host api-pbx serve o VoIP Manager.
  - job_name: 'voipmanager-backend'
    scheme: https
    metrics_path: '/actuator/prometheus'
    tls_config:
      insecure_skip_verify: false
    static_configs:
      - targets: ['api-pbx.asbtelecom.com.br']
        labels:
          app: 'voipmanager-backend'
          environment: 'production'

  # node-exporter — métricas de hardware/SO do host Linux.
  #   - srv-251: mesmo Swarm do Prometheus, scrape via DNS interno.
  #   - srv-248: outro Swarm/Portainer, scrape via IP público e porta publicada.
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          app: 'host-linux'
          environment: 'production'
          server: '224.251 - VPS LOGNET'
          instance: '45.187.224.251'
      - targets: ['45.187.224.248:9100']
        labels:
          app: 'host-linux'
          environment: 'production'
          server: '224.248 - VPS ASB'
          instance: '45.187.224.248'

  # cAdvisor — métricas de uso de recursos por container Docker.
  #   - srv-251: mesmo Swarm do Prometheus, scrape via DNS interno.
  #   - srv-248: outro Swarm/Portainer, scrape via IP público e porta publicada.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          app: 'containers'
          environment: 'production'
          server: '224.251 - VPS LOGNET'
          instance: '45.187.224.251'
      - targets: ['45.187.224.248:8080']
        labels:
          app: 'containers'
          environment: 'production'
          server: '224.248 - VPS ASB'
          instance: '45.187.224.248'
