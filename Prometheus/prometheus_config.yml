global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus se auto-monitorando (scrape do próprio processo).
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Loki expõe métricas Prometheus nativamente na própria porta HTTP (3100).
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # blackbox_exporter — probe HTTP externo no endpoint público do CRM.
  # Usado para monitorar a saúde do Reverse Proxy/edge, que roda fora
  # desta infra (não temos acesso direto a ele nem exporter interno).
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://crm-api.redelognet.com.br/api/v1/actuator/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # App Spring Boot do CRM Lognet — coleta métricas via Actuator/Micrometer
  # sobre HTTPS no endpoint público da API.
  - job_name: 'lognet-crm'
    scheme: https
    metrics_path: '/api/v1/actuator/prometheus'
    tls_config:
      insecure_skip_verify: false
    static_configs:
      - targets: ['crm-api.redelognet.com.br']
        labels:
          app: 'lognet-crm'
          env: 'production'

  # node-exporter — métricas de hardware/SO do host Linux.
  # Em mode: global, o DNS tasks.node-exporter retorna uma task por nó Swarm.
  - job_name: 'node-exporter'
    dns_sd_configs:
      - names:
          - tasks.node-exporter
        type: A
        port: 9100
    relabel_configs:
      - target_label: app
        replacement: host-linux
      - target_label: env
        replacement: production

  # cAdvisor — métricas de uso de recursos por container Docker.
  # Em mode: global, o DNS tasks.cadvisor retorna uma task por nó Swarm.
  - job_name: 'cadvisor'
    dns_sd_configs:
      - names:
          - tasks.cadvisor
        type: A
        port: 8080
    relabel_configs:
      - target_label: app
        replacement: containers
      - target_label: env
        replacement: production
