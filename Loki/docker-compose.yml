services:
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    configs:
      - source: loki_config
        target: /etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - network_swarm_public

configs:
  loki_config:
    file: ./loki_config.yml

volumes:
  loki_data:

networks:
  network_swarm_public:
    external: true
