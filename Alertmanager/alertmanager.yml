# Configuração do Alertmanager.
# Recebe os alertas "firing" do Prometheus (bloco `alerting:` em
# prometheus_config.yml) e os transforma em mensagens no Telegram.
#
# Editar: alterar aqui, push, e no Portainer "Pull and redeploy" da stack
# Alertmanager. O container recria e recarrega a config.

global:
  resolve_timeout: 5m

# Árvore de roteamento: todo alerta entra pela raiz e desce até a rota mais
# específica que casar. `continue: false` (padrão) para a busca no primeiro match.
route:
  receiver: telegram
  # Agrupa alertas do mesmo tipo/serviço numa única mensagem.
  group_by: ['alertname', 'application', 'job']
  # Espera 30s juntando alertas novos do mesmo grupo antes do 1º envio.
  group_wait: 30s
  # Depois do 1º envio, espera 5min antes de mandar novidades do mesmo grupo.
  group_interval: 5m
  # Realerta um grupo ainda ativo a cada 4h (lembrete de que não foi resolvido).
  repeat_interval: 4h

  # Dois grupos no Telegram, separados por quem age:
  #   TV          -> tudo com servico="flussonic" (canais, origens, ping dos IPs
  #                  do Flussonic, TargetDown do exporter)
  #   Aplicações  -> o resto (apps Java, APIs, certificados, infra da observabilidade)
  # Em ambos, severity="warning" chega sem som (disable_notifications) e
  # "critical" toca normalmente.
  routes:
    # TV: agrupa por origem principal para uma queda de origem com dezenas de
    # canais não virar uma mensagem gigante (limite de 4096 caracteres do Telegram).
    - matchers:
        - servico="flussonic"
      receiver: telegram-tv
      group_by: ['alertname', 'primary']
      group_wait: 30s
      repeat_interval: 1h
      routes:
        - matchers:
            - severity="warning"
          receiver: telegram-tv-silencioso

    # Aplicações — críticos: realerta de hora em hora enquanto estiver de pé.
    - matchers:
        - severity="critical"
      receiver: telegram
      group_wait: 10s
      repeat_interval: 1h

    # Aplicações — atenção: sem som.
    - matchers:
        - severity="warning"
      receiver: telegram-silencioso

# Suprime ruído: se o alvo está DOWN, não faz sentido também gritar sobre
# latência/heap/pool do mesmo alvo.
inhibit_rules:
  - source_matchers:
      - alertname="TargetDown"
    target_matchers:
      - severity=~"warning|critical"
    equal: ['job', 'instance']
  # Host sem ping: perda e latência do mesmo IP são consequência, não notifica.
  - source_matchers:
      - alertname="IcmpHostDown"
    target_matchers:
      - alertname=~"IcmpPacketLoss|IcmpHighLatency"
    equal: ['instance']
  # Origem principal caída: os canais dela indo para a reserva é consequência.
  - source_matchers:
      - alertname="FlussonicSourceDown"
    target_matchers:
      - alertname="FlussonicStreamOnBackup"
    equal: ['primary']
  # API do Flussonic fora: todos os canais aparecem sem sinal.
  - source_matchers:
      - alertname="FlussonicApiDown"
    target_matchers:
      - alertname=~"FlussonicStreamDown|FlussonicSourceDown|FlussonicStreamOnBackup"
    equal: ['instance']

receivers:
  # Grupo de Aplicações. As outras três variações reaproveitam esta config
  # (âncora &telegram_base + merge `<<:`) trocando só chat_id e o som.
  - name: telegram
    telegram_configs:
      - &telegram_base
        send_resolved: true
        # Token lido do Docker secret montado pelo compose.
        bot_token_file: /run/secrets/telegram_bot_token
        # ID do chat/grupo/canal de destino. Grupo = número negativo.
        # Descobrir: adicione o bot ao grupo e chame
        #   https://api.telegram.org/bot<TOKEN>/getUpdates
        # Grupo "Lognet - Observabilidade", supergrupo desde 2026-09-23 (o id
        # antigo -5439281417 passou a falhar com "group chat was upgraded to a
        # supergroup chat"). Se o id mudar de novo, o novo vem no
        # `migrate_to_chat_id` da resposta de erro de um sendMessage ao id antigo.
        chat_id: -1004347506618
        parse_mode: HTML
        # Cartão no estilo das notificações do Zabbix/WhatsApp: um cabeçalho de
        # status + um bloco "ficha" por alerta do grupo, com campos rotulados.
        # Textos vindos de labels/annotations passam por `html` (ex.: "A&E" quebraria
        # o parse_mode HTML do Telegram). `canais` é annotation dos alertas de
        # ping/origem com os canais do Flussonic afetados.
        # `exported_job` é o nome da tarefa @Scheduled (o Prometheus renomeia a
        # tag `job` da métrica por colidir com o `job` do scrape).
        message: |-
          {{ if eq .Status "firing" -}}
          🚨 <b>PROBLEMA DETECTADO</b> 🚨
          {{- else -}}
          ✅ <b>PROBLEMA RESOLVIDO</b> ✅
          {{- end }}
          {{- with .CommonLabels.severity }}
          {{ if eq . "critical" }}🔴 Severidade: <b>crítico</b>{{ else }}🟡 Severidade: <b>atenção</b>{{ end }}
          {{- end }}
          {{- if gt (len .Alerts) 1 }}
          📦 <b>{{ len .Alerts }}</b> ocorrências neste grupo
          {{- end }}
          {{ range .Alerts }}
          ━━━━━━━━━━━━
          {{ if .Labels.application -}}
          🖥 <b>Aplicação:</b> <code>{{ .Labels.application }}</code>
          {{- else if .Labels.job -}}
          🖥 <b>Serviço:</b> <code>{{ .Labels.job }}</code>
          {{- end }}
          {{- with .Labels.instance }}
          🌐 <b>Alvo:</b> <code>{{ . }}</code>
          {{- end }}
          {{- with .Labels.exported_job }}
          ⏱ <b>Tarefa:</b> <code>{{ . }}</code>
          {{- end }}
          {{- with .Labels.stream }}
          📺 <b>Canal:</b> <code>{{ . }}</code>
          {{- end }}
          {{- with .Labels.title }}
          🏷 <b>Nome:</b> {{ . | html }}
          {{- end }}
          {{- with .Labels.primary }}
          📡 <b>Origem principal:</b> <code>{{ . }}</code>
          {{- end }}
          {{- if and .Labels.source (ne .Labels.source .Labels.primary) }}
          🔁 <b>Origem ativa:</b> <code>{{ .Labels.source }}</code>
          {{- end }}
          {{- with .Labels.client_name }}
          🔌 <b>Integração:</b> <code>{{ . }}</code>
          {{- end }}
          {{ if eq $.Status "firing" }}⚠️{{ else }}✅{{ end }} <b>{{ if eq $.Status "resolved" }}Solucionado:{{ else }}Problema:{{ end }}</b> {{ with .Annotations.titulo }}{{ . }}{{ else }}{{ .Labels.alertname }}{{ end }}
          📊 <b>Detalhe:</b> {{ .Annotations.summary | html }}
          {{- with .Annotations.description }}
          <i>{{ . | html }}</i>
          {{- end }}
          {{- with .Annotations.canais }}
          📺 <b>Canais:</b> {{ . | html }}
          {{- end }}
          {{ if eq $.Status "firing" -}}
          🕐 <b>Quando:</b> {{ .StartsAt.Local.Format "02/01/2006 às 15:04:05" }}
          {{- else -}}
          🕐 <b>Detectado:</b> {{ .StartsAt.Local.Format "02/01/2006 às 15:04:05" }}
          🕑 <b>Resolvido:</b> {{ .EndsAt.Local.Format "02/01/2006 às 15:04:05" }}
          ⌛ <b>Duração:</b> {{ .EndsAt.Sub .StartsAt }}
          {{- end }}
          {{- end }}
          ━━━━━━━━━━━━
          {{ with .ExternalURL }}<a href="{{ . }}">🔗 abrir Alertmanager</a>{{ end }}

  - name: telegram-silencioso
    telegram_configs:
      - <<: *telegram_base
        disable_notifications: true

  # Grupo "Lognet - Alertas TV" (canais do Flussonic). Já é supergrupo (id
  # -100…, convertido em 2026-09-23; o id de grupo comum -5593580296 não vale mais).
  - name: telegram-tv
    telegram_configs:
      - <<: *telegram_base
        chat_id: -1004439481378

  - name: telegram-tv-silencioso
    telegram_configs:
      - <<: *telegram_base
        chat_id: -1004439481378
        disable_notifications: true
