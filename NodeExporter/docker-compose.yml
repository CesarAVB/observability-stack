version: "3.8"

# Stack Swarm do node-exporter (métricas do host: CPU, RAM, disco, rede, load).
# Deploy: docker stack deploy -c docker-compose.yml node-exporter
#
# A rede abaixo deve ser a MESMA rede overlay onde o Prometheus já está.

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|securityfs|sysfs|tmpfs|tracefs)$$"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    deploy:
      mode: global
      restart_policy:
        condition: any

networks:
  monitoring:
    external: true
    name: network_swarm_public
