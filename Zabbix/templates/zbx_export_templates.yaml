zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 0e55488e98e44ecbb7bd7fd4fcc22925
      name: 'Templates/Network devices'
  templates:
    - uuid: afcfcf34c154459184482a0bf0fcdeaa
      template: 'ZTE C300 PON and Optical Monitoring by SNMP'
      name: 'ZTE C300 PON and Optical Monitoring by SNMP'
      description: |
        Template for monitoring ZTE C300 (V2.1.0) PON Ports and Optical Modules.
        Includes interface discovery, operational status, traffic counters, ONT registration,
        optical power (Rx/Tx), temperature, and hardware monitoring.
        Based on ZTE-AN-SMI MIB (1.3.6.1.4.1.3902.1082) for C300 Series.
        Generated by Manus AI for Zabbix 7.0.
      groups:
        - name: 'Templates/Network devices'
      discovery_rules:
        - uuid: 157ebfea85ea451f8f06c6908d872f98
          name: 'Hardware Board Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#BOARDNAME},1.3.6.1.4.1.3902.1082.20.10.4.2.1]'
          key: zte.board.discovery
          delay: 1h
          item_prototypes:
            - uuid: 310aaac2394f487490fe8ecf53591038
              name: 'Board {#BOARDNAME}: CPU Load'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.20.50.4.2.2.{#SNMPINDEX}'
              key: 'zte.board.cpu_load[{#SNMPINDEX}]'
              value_type: FLOAT
              units: '%'
              tags:
                - tag: Component
                  value: Board
              trigger_prototypes:
                - uuid: b8cab0279f3043808bdb1ae6c01e2c19
                  expression: 'last(/ZTE C300 PON and Optical Monitoring by SNMP/zte.board.cpu_load[{#SNMPINDEX}])>{$ZTE.BOARD.CPU.MAX}'
                  name: 'Board {#BOARDNAME}: High CPU Load'
                  priority: WARNING
            - uuid: 5525229b37d246bea2e9e0b1757a06ce
              name: 'Board {#BOARDNAME}: Memory Usage'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.20.55.4.2.2.{#SNMPINDEX}'
              key: 'zte.board.memory_usage[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: '%'
              tags:
                - tag: Component
                  value: Board
            - uuid: 1b0cef9091584b06a09ffce41e9071ea
              name: 'Board {#BOARDNAME}: Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.20.10.4.2.2.{#SNMPINDEX}'
              key: 'zte.board.status[{#SNMPINDEX}]'
              delay: 5m
              tags:
                - tag: Component
                  value: Board
            - uuid: 6db56cba111e4fa2b17cb5c3ad8a2a2f
              name: 'Board {#BOARDNAME}: Temperature'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.20.10.4.2.3.{#SNMPINDEX}'
              key: 'zte.board.temperature[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: C
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: Component
                  value: Board
              trigger_prototypes:
                - uuid: a3bdb19f37cf4c0d9f995cc9fe235573
                  expression: 'last(/ZTE C300 PON and Optical Monitoring by SNMP/zte.board.temperature[{#SNMPINDEX}])>{$ZTE.BOARD.TEMP.MAX}'
                  name: 'Board {#BOARDNAME}: High Temperature'
                  priority: WARNING
        - uuid: ca57e70de00d45308d9a52ff38ef7e51
          name: 'ONT Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.4.1.3902.1082.80.50.4.2.1]'
          key: zte.ont.discovery
          delay: 1h
          item_prototypes:
            - uuid: e31dc5933f6742988dcfb2a37ad5e2a9
              name: 'ONT {#SNMPVALUE}: Firmware Version'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.80.50.4.2.9.{#SNMPINDEX}'
              key: 'zte.ont.firmware[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              trends: '0'
              tags:
                - tag: Component
                  value: ONT
            - uuid: 303c23f2433549ada226094899beff25
              name: 'ONT {#SNMPVALUE}: ID'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.80.50.4.2.4.{#SNMPINDEX}'
              key: 'zte.ont.id[{#SNMPINDEX}]'
              delay: 1h
              tags:
                - tag: Component
                  value: ONT
            - uuid: ba1d41d6340a4b6e930592107f21e773
              name: 'ONT {#SNMPVALUE}: Model'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.80.50.4.2.11.{#SNMPINDEX}'
              key: 'zte.ont.model[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              trends: '0'
              tags:
                - tag: Component
                  value: ONT
            - uuid: 5ea157b0f50449ae9095418074a4e82b
              name: 'ONT {#SNMPVALUE}: PON Port'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.80.50.4.2.3.{#SNMPINDEX}'
              key: 'zte.ont.pon_port[{#SNMPINDEX}]'
              delay: 1h
              tags:
                - tag: Component
                  value: ONT
            - uuid: d7c4cbe1879b4d3a8f42526d882f138e
              name: 'ONT {#SNMPVALUE}: Rx Power'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.80.50.4.2.6.{#SNMPINDEX}'
              key: 'zte.ont.rx_power[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: dBm
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: Component
                  value: ONT
              trigger_prototypes:
                - uuid: 39aa02cad2f9413c8dc0c140a9a76a26
                  expression: 'last(/ZTE C300 PON and Optical Monitoring by SNMP/zte.ont.rx_power[{#SNMPINDEX}])<{$ZTE.ONT.RX.MIN}'
                  name: 'ONT {#SNMPVALUE}: Low Rx Power'
                  priority: WARNING
            - uuid: 646022ef1f78446095fa64c5167ae442
              name: 'ONT {#SNMPVALUE}: Serial Number'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.80.50.4.2.12.{#SNMPINDEX}'
              key: 'zte.ont.serial[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              trends: '0'
              tags:
                - tag: Component
                  value: ONT
            - uuid: f8dee54ce0ae42cfbad6f3a25013aa1d
              name: 'ONT {#SNMPVALUE}: Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.80.50.4.2.2.{#SNMPINDEX}'
              key: 'zte.ont.status[{#SNMPINDEX}]'
              delay: 5m
              tags:
                - tag: Component
                  value: ONT
              trigger_prototypes:
                - uuid: 2834c5bc68c547fb8ab88958cc21a81a
                  expression: 'last(/ZTE C300 PON and Optical Monitoring by SNMP/zte.ont.status[{#SNMPINDEX}])=3'
                  name: 'ONT {#SNMPVALUE}: ONT Offline'
                  priority: WARNING
                  manual_close: 'YES'
            - uuid: ffcdb7700a4844e08d4702eabe10238f
              name: 'ONT {#SNMPVALUE}: Tx Power'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.80.50.4.2.7.{#SNMPINDEX}'
              key: 'zte.ont.tx_power[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: dBm
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: Component
                  value: ONT
            - uuid: e6d0ac8d9eee4df886837015f01eef2e
              name: 'ONT {#SNMPVALUE}: Uptime'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.80.50.4.2.8.{#SNMPINDEX}'
              key: 'zte.ont.uptime[{#SNMPINDEX}]'
              delay: 5m
              units: s
              tags:
                - tag: Component
                  value: ONT
            - uuid: 53d4856c5c6245699e1e42f598640bae
              name: 'ONT {#SNMPVALUE}: Vendor'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.80.50.4.2.10.{#SNMPINDEX}'
              key: 'zte.ont.vendor[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              trends: '0'
              tags:
                - tag: Component
                  value: ONT
        - uuid: d782cd1eca304191b6816ec608691763
          name: 'PON Ports Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},IF-MIB::ifDescr,{#IFTYPE},IF-MIB::ifType]'
          key: zte.pon.discovery
          delay: 1h
          filter:
            evaltype: OR
            conditions:
              - macro: '{#IFTYPE}'
                value: '250'
                formulaid: A
          item_prototypes:
            - uuid: 2d179f576a1c4267a01127cde059c013
              name: 'PON {#SNMPVALUE}: Admin Status'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifAdminStatus.{#SNMPINDEX}'
              key: 'zte.pon.admin_status[{#SNMPINDEX}]'
              delay: 5m
              valuemap:
                name: zte_pon_status
              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: 014086d8f5a149c6b253ab2535aa9632
              name: 'PON {#SNMPVALUE}: Alias'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifAlias.{#SNMPINDEX}'
              key: 'zte.pon.alias[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              trends: '0'
              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: 9a898b221d854456aa17ee8f26811949
              name: 'PON {#SNMPVALUE}: Bias Current'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.70.40.4.2.33.{#SNMPINDEX}'
              key: 'zte.pon.bias_current[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: mA
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: f90035927f434870af5ebecfa003cca0
              name: 'PON {#SNMPVALUE}: In Discards'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifHCInDiscards.{#SNMPINDEX}'
              key: 'zte.pon.in_discards[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
