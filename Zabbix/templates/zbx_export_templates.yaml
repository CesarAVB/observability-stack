            - uuid: 5d3b4d5e67784f41a87078a483b6125c
              name: 'PON {#SNMPVALUE}: ONTs Offline'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.70.15.4.2.4.{#SNMPINDEX}'
              key: 'zte.pon.onts_offline[{#SNMPINDEX}]'
              delay: 5m
