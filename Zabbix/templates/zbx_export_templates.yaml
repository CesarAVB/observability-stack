            - uuid: ce0bd2d0613f4923adc1446b689782cc
              name: 'PON {#SNMPVALUE}: In Octets (HC)'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifHCInOctets.{#SNMPINDEX}'
