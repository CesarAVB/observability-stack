              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: efd92040023b46ddb094d147dd9b5261
              name: 'PON {#SNMPVALUE}: In Errors'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifHCInErrors.{#SNMPINDEX}'
              key: 'zte.pon.in_errors[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
