            - uuid: 3ef7c581d97843fab01b070953454f12
              name: 'PON {#SNMPVALUE}: Temperature'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.70.40.4.2.31.{#SNMPINDEX}'
              key: 'zte.pon.temperature[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: C
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: 8c01793e64944b1e9517e8c59419f85f
              name: 'PON {#SNMPVALUE}: Tx Power'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.70.40.4.2.30.{#SNMPINDEX}'
              key: 'zte.pon.tx_power[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: dBm
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: 244f88dc457449db91bd2aca3eb93330
              name: 'PON {#SNMPVALUE}: Vendor Name'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.70.40.4.2.2.{#SNMPINDEX}'
              key: 'zte.pon.vendor_name[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              trends: '0'
              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: 94ebc430679d4eaba123dd27da9351a8
              name: 'PON {#SNMPVALUE}: Vendor SN'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.70.40.4.2.3.{#SNMPINDEX}'
              key: 'zte.pon.vendor_sn[{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              trends: '0'
              tags:
                - tag: Component
                  value: 'PON Port'
        - uuid: c7eac0358449429599c381a38f250385
          name: 'PSU and Fan Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PSU_NAME},1.3.6.1.4.1.3902.1082.20.20.4.2.1]'
          key: zte.psu.discovery
          delay: 1h
          item_prototypes:
            - uuid: 81f5fdca0b664a8998f8ef8d19766053
              name: 'Fan {#PSU_NAME}: Speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.20.30.4.2.3.{#SNMPINDEX}'
              key: 'zte.fan.speed[{#SNMPINDEX}]'
              delay: 5m
              units: RPM
              tags:
                - tag: Component
                  value: Hardware
            - uuid: d5f41d382017464a87c4c26f3978803f
              name: 'Fan {#PSU_NAME}: Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.20.30.4.2.2.{#SNMPINDEX}'
              key: 'zte.fan.status[{#SNMPINDEX}]'
              delay: 5m
              tags:
                - tag: Component
                  value: Hardware
            - uuid: c031fddac01642debcdeb6c3d6c8cdd9
              name: 'PSU {#PSU_NAME}: Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.20.20.4.2.2.{#SNMPINDEX}'
              key: 'zte.psu.status[{#SNMPINDEX}]'
              delay: 5m
              tags:
                - tag: Component
                  value: Hardware
              trigger_prototypes:
                - uuid: 2d6b540ad9514a58aeaae03829b0442f
                  expression: 'last(/ZTE C300 PON and Optical Monitoring by SNMP/zte.psu.status[{#SNMPINDEX}])=2'
                  name: 'PSU {#PSU_NAME}: PSU Down'
                  priority: HIGH
      macros:
        - macro: '{$ZTE.BOARD.CPU.MAX}'
          value: '80'
        - macro: '{$ZTE.BOARD.TEMP.MAX}'
          value: '70'
        - macro: '{$ZTE.ONT.RX.MIN}'
          value: '-27'
      valuemaps:
        - uuid: 2c2c1c18f91f4b528d6305e99df88c99
          name: zte_pon_status
          mappings:
            - value: '1'
              newvalue: Up
            - value: '2'
              newvalue: Down
            - value: '3'
              newvalue: Testing
            - value: '4'
              newvalue: Unknown
            - value: '5'
              newvalue: Dormant
            - value: '6'
              newvalue: NotPresent
            - value: '7'
              newvalue: lowerLayerDown
