            - uuid: 35b622fe5b6c477a8eafbd397bd3c609
              name: 'PON {#SNMPVALUE}: ONTs Online'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.70.15.4.2.3.{#SNMPINDEX}'
              key: 'zte.pon.onts_online[{#SNMPINDEX}]'
              delay: 5m
              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: 1678643d99da4915a635addb3f42ea23
              name: 'PON {#SNMPVALUE}: ONTs Registered'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.70.15.4.2.2.{#SNMPINDEX}'
              key: 'zte.pon.onts_registered[{#SNMPINDEX}]'
              delay: 5m
              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: 5007ed2a64144d258348d0f419a34dc3
              name: 'PON {#SNMPVALUE}: Operational Status'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifOperStatus.{#SNMPINDEX}'
              key: 'zte.pon.operational_status[{#SNMPINDEX}]'
              delay: 5m
              valuemap:
                name: zte_pon_status
              tags:
                - tag: Component
                  value: 'PON Port'
              trigger_prototypes:
                - uuid: ba7cc211c61346779ba947dbaa6f3925
                  expression: 'last(/ZTE C300 PON and Optical Monitoring by SNMP/zte.pon.operational_status[{#SNMPINDEX}])=2'
                  name: 'PON {#SNMPVALUE}: PON Port Down'
                  priority: AVERAGE
                  manual_close: 'YES'
            - uuid: 6655c89830db4976952d8a9438de7d86
              name: 'PON {#SNMPVALUE}: Out Discards'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifHCOutDiscards.{#SNMPINDEX}'
              key: 'zte.pon.out_discards[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: 6bbce36e16da4119838cfc73df4e7e91
              name: 'PON {#SNMPVALUE}: Out Errors'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifHCOutErrors.{#SNMPINDEX}'
              key: 'zte.pon.out_errors[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: cdb7e727e90d48a8949d38f95426de60
              name: 'PON {#SNMPVALUE}: Out Octets (HC)'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifHCOutOctets.{#SNMPINDEX}'
              key: 'zte.pon.out_octets[{#SNMPINDEX}]'
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: b4f7722fc13a4661a9bdaeaeb7cc6905
              name: 'PON {#SNMPVALUE}: Rx Power'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.3902.1082.70.40.4.2.7.{#SNMPINDEX}'
              key: 'zte.pon.rx_power[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: dBm
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: c5526919baeb4a0fb2102d0938f61dd8
              name: 'PON {#SNMPVALUE}: Speed'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifHighSpeed.{#SNMPINDEX}'
              key: 'zte.pon.speed[{#SNMPINDEX}]'
              delay: 1h
              units: Mbps
              tags:
                - tag: Component
                  value: 'PON Port'
            - uuid: f660a34e1f814a0ba2e1215b57758e99
