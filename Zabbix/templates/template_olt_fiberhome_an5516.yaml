              trends: 90d
              valuemap:
                name: 'ONU Status (Fiberhome AN5516)'
              description: |
                OID confirmada em produção (getOnuStatus). Códigos
                confirmados pelo script real (tabela $StatusNames):
                0=rompimento/fiber cut, 1=online (implícito, não alertado
                pelo script), 2=falta de energia/power cut, 3=offline,
                4=desconhecido/averiguar. Ver valuemap "ONU Status
                (Fiberhome AN5516)".
              trigger_prototypes:
                -
                  uuid: bde1d959892246b590b0d24efd6ef31a
                  expression: 'last(/OLT Fiberhome AN5516/fh.onu.status[{#SNMPINDEX}])={$FH.ONU.STATUS.OFFLINE_VALUE}'
                  name: 'Slot {#PONSLOT} - PON {#PONPORT} - ONU {#SNMPINDEX}: offline'
                  priority: AVERAGE
              tags:
                -
                  tag: component
                  value: onu
                -
                  tag: metric
                  value: status
                -
                  tag: pon
                  value: '{#PONSLOT}-{#PONPORT}'
