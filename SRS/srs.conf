# Config do SRS (Simple Realtime Server) — ossrs/srs.
# Referência completa: https://ossrs.io/lts/en-us/docs/v6/doc/all-features

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# API HTTP (porta 1985) — console/estatísticas/controle. Fica só na rede
# interna (network_swarm_public); não publicar externamente.
http_api {
    enabled         on;
    listen          1985;
}

# Servidor HTTP (porta 8080) — serve HTTP-FLV e HLS gerados pelos vhosts.
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

stats {
    network         0;
}

vhost __defaultVhost__ {
    # HTTP-FLV: publica em rtmp://<host>/live/<stream> e assiste em
    # http://<host>:8080/live/<stream>.flv
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS: mesmo stream também disponível em
    # http://<host>:8080/live/<stream>.m3u8
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    10;
        hls_window      60;
    }
}
